x-test-container: &test-container
  network_mode: none
  command: tail -f /dev/null
  # PID 1 ignores SIGTERM, without this every stop waits out the default 10s
  stop_grace_period: 1s

services:
  should-keep-restarting:
    <<: *test-container
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    labels:
      - "${AUTOHEAL_CONTAINER_LABEL:?}=true"
    healthcheck:
      test: exit 1
      interval: 3s
      timeout: 1s
      retries: 3
      start_period: 5s

  shouldnt-restart-healthy:
    <<: *test-container
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    labels:
      - "${AUTOHEAL_CONTAINER_LABEL:?}=true"
    healthcheck:
      test: exit 0
      interval: 2s
      timeout: 1s
      retries: 1
      start_period: 1s

  shouldnt-restart-no-label:
    <<: *test-container
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    healthcheck:
      test: exit 1
      interval: 3s
      timeout: 1s
      retries: 1
      start_period: 5s

  ignore:
    <<: *test-container
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    labels:
      - "${AUTOHEAL_CONTAINER_LABEL:?}=true"
    healthcheck:
      test: exit 1
      interval: 3s
      timeout: 1s
      retries: 1
      start_period: 5s

  autoheal-rs:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AUTOHEAL_CONTAINER_LABEL: ${AUTOHEAL_CONTAINER_LABEL:?}
      AUTOHEAL_INTERVAL: "10"
      AUTOHEAL_EXCLUDE_CONTAINERS: ${COMPOSE_PROJECT_NAME:?}-ignore-1
      # WEBHOOK_URL: https://ntfy.sh/...
    volumes:
      - type: bind
        source: "${DOCKER_SOCKET:-/var/run/docker.sock}"
        target: /var/run/docker.sock
    network_mode: host
