x-test-container: &test-container
  network_mode: none
  command: tail -f /dev/null
  # PID 1 ignores SIGTERM, without this every stop waits out the default 10s
  stop_grace_period: 1s
  # the health check fails while the marker exists, the watcher creates it and restarting the container empties the tmpfs
  tmpfs:
    - /flags
  healthcheck:
    test: ["CMD-SHELL", "test ! -e /flags/unhealthy"]
    interval: 1s
    timeout: 1s
    retries: 1

services:
  unhealthy-labeled:
    <<: *test-container
    image: alpine:3.24.2@sha256:3cf95fe0816180395592b8373f3ec60663f076127617bbacb4eacf9667afe2e9
    labels:
      - "${AUTOHEAL_CONTAINER_LABEL:?}=true"

  healthy-labeled:
    <<: *test-container
    image: alpine:3.24.2@sha256:3cf95fe0816180395592b8373f3ec60663f076127617bbacb4eacf9667afe2e9
    labels:
      - "${AUTOHEAL_CONTAINER_LABEL:?}=true"

  unhealthy-unlabeled:
    <<: *test-container
    image: alpine:3.24.2@sha256:3cf95fe0816180395592b8373f3ec60663f076127617bbacb4eacf9667afe2e9

  unhealthy-excluded:
    <<: *test-container
    image: alpine:3.24.2@sha256:3cf95fe0816180395592b8373f3ec60663f076127617bbacb4eacf9667afe2e9
    labels:
      - "${AUTOHEAL_CONTAINER_LABEL:?}=true"

  autoheal-rs:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AUTOHEAL_CONTAINER_LABEL: ${AUTOHEAL_CONTAINER_LABEL:?}
      AUTOHEAL_INTERVAL: "1"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "1"
      AUTOHEAL_EXCLUDE_CONTAINERS: ${COMPOSE_PROJECT_NAME:?}-unhealthy-excluded-1
      # WEBHOOK_URL: https://ntfy.sh/...
    volumes:
      - type: bind
        source: "${DOCKER_SOCKET:-/var/run/docker.sock}"
        target: /var/run/docker.sock
    network_mode: host
